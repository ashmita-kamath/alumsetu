# Render Blueprint for the AlumSetu API (server/).
# Render → New → Blueprint → pick this repo. It reads this file and creates the service.
services:
  - type: web
    name: alumsetu-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLIENT_URL
        sync: false
